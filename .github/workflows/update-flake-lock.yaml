name: update-flake-lock

# Weekly updates come from Dependabot (.github/dependabot.yml); this only
# handles single-input updates dispatched by thom-container.
#
# The PR is opened with a GitHub App token, not GITHUB_TOKEN: GitHub holds a
# GITHUB_TOKEN PR's CI run for approval, and the required checks must run on
# the PR's head commit. ci.yaml builds and merges the PR.
#
# Setup: a GitHub App with Contents and Pull requests read/write, installed on
# this repository. Repository variables FLAKE_UPDATE_APP_CLIENT_ID and
# FLAKE_UPDATE_APP_SLUG; repository secret FLAKE_UPDATE_APP_PRIVATE_KEY.
on:
  workflow_dispatch:
    inputs:
      input:
        description: Flake input to update (empty updates all)
        required: false
        default: ""

# One run per PR branch at a time, so two dispatches don't push the branch
# concurrently.
concurrency:
  group: update-flake-lock-${{ inputs.input }}

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.FLAKE_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLAKE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Upstream Nix, as on the machines (bootstrap.sh).
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ steps.app-token.outputs.token }}
          inputs: ${{ inputs.input }}
          branch: ${{ inputs.input && format('update_flake_lock_{0}', inputs.input) || 'update_flake_lock_action' }}
          pr-title: "${{ inputs.input && format('flake.lock: update {0}', inputs.input) || 'flake.lock: update inputs' }}"
          pr-labels: dependencies
          pr-body: |
            Automated changes by the [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock) GitHub Action.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
