name: build

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Upstream Nix, as on the machines (bootstrap.sh).
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          github_access_token: ${{ github.token }}
      # Pulls from and pushes to the Cachix cache, so builds missing from
      # cache.nixos.org (e.g. Darwin Swift builds lagging on Hydra) are done
      # once and reach the machines too. Push needs CACHIX_AUTH_TOKEN; without
      # it (e.g. Dependabot and update-flake-lock.yaml PRs) the cache is only read.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thomwiggers
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check
